# TEMPORARY: used to verify Actions can fire on a schedule. Delete this file after testing.
#
# GitHub limitation: scheduled workflows only run from the default branch (usually main).
# - On this branch only: use Actions → this workflow → "Run workflow" (pick branch schedule-test).
# - To test cron automatically: merge this branch to main (or temporarily make this branch default),
#   confirm runs appear, then delete this file / revert the merge.

name: Schedule trigger smoke test (TEMP)

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes UTC — noisy; remove after confirming triggers work.
    - cron: "*/10 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Report trigger context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "UTC:    $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "NY:     $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
