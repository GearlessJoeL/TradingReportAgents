name: Daily Agent Run

on:
  schedule:
    # GitHub Actions cron is UTC and does not support timezones.
    # Trigger both possible UTC times for 08:30 America/New_York (EST/EDT),
    # then gate execution in-job based on local New York time.
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check New York local time gate (08:30)
        id: timegate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected; bypassing time gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ny_hm="$(TZ=America/New_York date +%H:%M)"
          echo "Current America/New_York time: ${ny_hm}"
          if [ "${ny_hm}" = "08:30" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping run: not 08:30 in America/New_York."
          fi

      - name: Checkout repository
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.timegate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # emails.txt / watchlist.txt are gitignored locally; materialize them in CI from secrets.
      # Create repo secrets EMAILS_TXT and WATCHLIST_TXT (full file contents, multiline OK).
      - name: Write emails.txt and watchlist.txt from secrets
        if: steps.timegate.outputs.should_run == 'true'
        env:
          EMAILS_TXT: ${{ secrets.EMAILS_TXT }}
          WATCHLIST_TXT: ${{ secrets.WATCHLIST_TXT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          emails = os.environ.get("EMAILS_TXT", "")
          watch = os.environ.get("WATCHLIST_TXT", "")

          if emails.strip():
              Path("emails.txt").write_text(emails, encoding="utf-8", newline="\n")
          if watch.strip():
              Path("watchlist.txt").write_text(watch, encoding="utf-8", newline="\n")
          PY

      # GitHub never shows secret values; this only confirms files/recipient *count*.
      - name: Report emails.txt / watchlist.txt (no addresses printed)
        if: steps.timegate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          def recipient_lines(path: Path) -> int:
              if not path.is_file():
                  return 0
              n = 0
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if line and "@" in line:
                      n += 1
              return n

          def ticker_lines(path: Path) -> int:
              if not path.is_file():
                  return 0
              n = 0
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#"):
                      n += 1
              return n

          ep, wp = Path("emails.txt"), Path("watchlist.txt")
          ec, wc = recipient_lines(ep), ticker_lines(wp)
          print(f"emails.txt: {'present' if ep.is_file() else 'missing'}; lines with @: {ec}")
          print(f"watchlist.txt: {'present' if wp.is_file() else 'missing'}; non-comment lines: {wc}")
          PY

      - name: Run daily agent
        if: steps.timegate.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          REPORT_TICKER: ${{ vars.REPORT_TICKER }}
          REPORT_DATE: ${{ vars.REPORT_DATE }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS }}
          WATCHLIST_PATH: ${{ vars.WATCHLIST_PATH }}
          CHART_PERIOD: ${{ vars.CHART_PERIOD }}
          CHART_OUTPUT_DIR: ${{ vars.CHART_OUTPUT_DIR }}
          NOTIFY_TELEGRAM: ${{ vars.NOTIFY_TELEGRAM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          EMAILS_FILE: ${{ vars.EMAILS_FILE }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_DEEP_THINK_MODEL: ${{ vars.LLM_DEEP_THINK_MODEL }}
          LLM_QUICK_THINK_MODEL: ${{ vars.LLM_QUICK_THINK_MODEL }}
          LLM_CHART_MODEL: ${{ vars.LLM_CHART_MODEL }}
          LLM_BACKEND_URL: ${{ vars.LLM_BACKEND_URL }}
        run: python main.py
