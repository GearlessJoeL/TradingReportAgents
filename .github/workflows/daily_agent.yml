name: Daily Agent Run

on:
  schedule:
    # GitHub Actions cron is UTC; 08:30 EST = 13:30 UTC (Mon-Fri)
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily agent
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          REPORT_TICKER: ${{ vars.REPORT_TICKER }}
          REPORT_DATE: ${{ vars.REPORT_DATE }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS }}
          WATCHLIST_PATH: ${{ vars.WATCHLIST_PATH }}
          CHART_PERIOD: ${{ vars.CHART_PERIOD }}
          CHART_OUTPUT_DIR: ${{ vars.CHART_OUTPUT_DIR }}
          NOTIFY_TELEGRAM: ${{ vars.NOTIFY_TELEGRAM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          EMAILS_FILE: ${{ vars.EMAILS_FILE }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
        run: python main.py
