name: Daily Agent Run

on:
  schedule:
    # GitHub Actions cron is UTC and does not support timezones.
    # Requested EDT schedule (UTC-4):
    # - Primary: 06:00 ET -> 10:00 UTC
    # - Fallback: 07:00 ET -> 11:00 UTC
    - cron: "0 10 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: daily-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check trigger type (manual vs schedule)
        id: timegate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected; bypassing time gate."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule="${{ github.event.schedule }}"
          echo "Event: ${{ github.event_name }} (schedule: '${schedule}')"
          ny_now="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z (%z)')"
          echo "Current America/New_York time: ${ny_now}"

          # For the 07:00 ET fallback, only run if the 06:00 ET scheduled run
          # has not completed successfully today on this branch.
          if [ "${schedule}" = "0 11 * * 1-5" ]; then
            python - <<'PY'
            import datetime as dt
            import json
            import os
            import urllib.request

            token = os.environ["GH_TOKEN"]
            repo = os.environ["GITHUB_REPOSITORY"]
            workflow = os.environ["GITHUB_WORKFLOW"]
            ref_name = os.environ.get("GITHUB_REF_NAME", "")
            today = dt.datetime.now(dt.timezone.utc).date().isoformat()

            url = f"https://api.github.com/repos/{repo}/actions/runs?event=schedule&per_page=50"
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                },
            )

            with urllib.request.urlopen(req, timeout=30) as resp:
                payload = json.loads(resp.read().decode("utf-8"))

            should_run = True
            for run in payload.get("workflow_runs", []):
                if run.get("name") != workflow:
                    continue
                if ref_name and run.get("head_branch") != ref_name:
                    continue
                started = run.get("run_started_at") or run.get("created_at") or ""
                if not started.startswith(today):
                    continue
                if run.get("conclusion") != "success":
                    continue
                event = (run.get("event") or "").lower()
                if event != "schedule":
                    continue
                # Match the 10:00 UTC window for primary 06:00 ET run.
                if len(started) >= 13 and started[11:13] == "10":
                    should_run = False
                    break

            out_path = os.environ["GITHUB_OUTPUT"]
            with open(out_path, "a", encoding="utf-8") as f:
                f.write(f"should_run={'true' if should_run else 'false'}\n")

            print(
                "Fallback gate:",
                "running 07:00 ET job (06:00 ET success not found today)"
                if should_run
                else "skipping 07:00 ET job (06:00 ET already succeeded today)",
            )
            PY
            exit 0
          fi

          # Primary 06:00 ET schedule proceeds.
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        if: steps.timegate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.timegate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      # emails.txt / watchlist.txt are gitignored locally; materialize them in CI from secrets.
      # Create repo secrets EMAILS_TXT and WATCHLIST_TXT (full file contents, multiline OK).
      - name: Write emails.txt and watchlist.txt from secrets
        if: steps.timegate.outputs.should_run == 'true'
        env:
          EMAILS_TXT: ${{ secrets.EMAILS_TXT }}
          WATCHLIST_TXT: ${{ secrets.WATCHLIST_TXT }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          emails = os.environ.get("EMAILS_TXT", "")
          watch = os.environ.get("WATCHLIST_TXT", "")

          if emails.strip():
              Path("emails.txt").write_text(emails, encoding="utf-8", newline="\n")
          if watch.strip():
              Path("watchlist.txt").write_text(watch, encoding="utf-8", newline="\n")
          PY

      # GitHub never shows secret values; this only confirms files/recipient *count*.
      - name: Report emails.txt / watchlist.txt (no addresses printed)
        if: steps.timegate.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          def recipient_lines(path: Path) -> int:
              if not path.is_file():
                  return 0
              n = 0
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if line and "@" in line:
                      n += 1
              return n

          def ticker_lines(path: Path) -> int:
              if not path.is_file():
                  return 0
              n = 0
              for raw in path.read_text(encoding="utf-8").splitlines():
                  line = raw.strip()
                  if line and not line.startswith("#"):
                      n += 1
              return n

          ep, wp = Path("emails.txt"), Path("watchlist.txt")
          ec, wc = recipient_lines(ep), ticker_lines(wp)
          print(f"emails.txt: {'present' if ep.is_file() else 'missing'}; lines with @: {ec}")
          print(f"watchlist.txt: {'present' if wp.is_file() else 'missing'}; non-comment lines: {wc}")
          PY

      - name: Run daily agent (with retry/backoff)
        if: steps.timegate.outputs.should_run == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          REPORT_TICKER: ${{ vars.REPORT_TICKER }}
          REPORT_DATE: ${{ vars.REPORT_DATE }}
          NEWS_LOOKBACK_DAYS: ${{ vars.NEWS_LOOKBACK_DAYS }}
          WATCHLIST_PATH: ${{ vars.WATCHLIST_PATH }}
          CHART_PERIOD: ${{ vars.CHART_PERIOD }}
          CHART_OUTPUT_DIR: ${{ vars.CHART_OUTPUT_DIR }}
          NOTIFY_TELEGRAM: ${{ vars.NOTIFY_TELEGRAM }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          EMAILS_FILE: ${{ vars.EMAILS_FILE }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_DEEP_THINK_MODEL: ${{ vars.LLM_DEEP_THINK_MODEL }}
          LLM_QUICK_THINK_MODEL: ${{ vars.LLM_QUICK_THINK_MODEL }}
          LLM_CHART_MODEL: ${{ vars.LLM_CHART_MODEL }}
          LLM_BACKEND_URL: ${{ vars.LLM_BACKEND_URL }}
          REPORT_REVIEW_MAX_ROUNDS: ${{ vars.REPORT_REVIEW_MAX_ROUNDS }}
          REPORT_REVIEW_STRICT: ${{ vars.REPORT_REVIEW_STRICT }}
          CI_MAX_ATTEMPTS: ${{ vars.CI_MAX_ATTEMPTS }}
          CI_RETRY_BACKOFF_SECONDS: ${{ vars.CI_RETRY_BACKOFF_SECONDS }}
        run: |
          set -euo pipefail
          mkdir -p output
          attempts="${CI_MAX_ATTEMPTS:-2}"
          backoff="${CI_RETRY_BACKOFF_SECONDS:-20}"
          if [ "$attempts" -lt 1 ]; then
            attempts=1
          fi
          for i in $(seq 1 "$attempts"); do
            echo "Run attempt $i/$attempts"
            if python main.py | tee "output/latest_report_attempt_${i}.md"; then
              cp "output/latest_report_attempt_${i}.md" output/latest_report.md
              echo "Daily agent run succeeded on attempt $i."
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              sleep_secs=$(( backoff * i ))
              echo "Attempt $i failed; retrying in ${sleep_secs}s..."
              sleep "$sleep_secs"
            fi
          done
          echo "Daily agent failed after $attempts attempt(s)."
          exit 1

      - name: Upload run artifacts
        if: always() && steps.timegate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-agent-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/**/*.md
            output/**/*.png
